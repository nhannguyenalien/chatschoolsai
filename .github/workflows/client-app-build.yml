name: Build Schools AI (4 platforms)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'client-v*'

permissions:
  contents: write

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/client_app

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK and AAB
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Collect Android packages
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Schools-AI-Android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Schools-AI-Android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Schools-AI-Android
          path: apps/client_app/dist/Schools-AI-Android.*
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Create portable Windows package
        shell: pwsh
        run: |
          $package = "Schools-AI-Windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item 'build/windows/x64/runner/Release/*' "dist/$package" -Recurse -Force
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Schools-AI-Windows-x64
          path: apps/client_app/dist/Schools-AI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  apple:
    name: iOS and macOS
    needs: quality
    runs-on: macos-15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Build unsigned macOS app
        run: flutter build macos --release
      - name: Package Apple builds
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "dist/Schools-AI-iOS-unsigned.zip"
          hdiutil create -volname 'Schools AI' -srcfolder 'build/macos/Build/Products/Release/Schools AI.app' -ov -format UDZO "dist/Schools-AI-macOS-unsigned.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Schools-AI-Apple-unsigned
          path: |
            apps/client_app/dist/Schools-AI-iOS-unsigned.zip
            apps/client_app/dist/Schools-AI-macOS-unsigned.dmg
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish public downloads
    needs: [android, windows, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Schools-AI-*
          path: dist
          merge-multiple: true
      - name: Publish rolling or versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'client-latest' }}
          name: ${{ github.ref_type == 'tag' && format('Schools AI {0}', github.ref_name) || 'Schools AI — Latest build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
