name: Build Schools AI for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client_app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create portable package
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Split('+')[0]
          $source = 'build/windows/x64/runner/Release'
          $package = "Schools-AI-$version-Windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "$source/*" "dist/$package" -Recurse -Force
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip" -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Schools-AI-Windows-x64
          path: apps/client_app/dist/Schools-AI-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
