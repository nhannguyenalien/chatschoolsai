<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>AI Admin - Nhật ký trò chuyện</title>
    
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Thư viện bắt buộc (PocketBase, Markdown, DOMPurify) -->
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00647c",
                        "primary-container": "#007f9d",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#fafdff",
                        "surface": "#f8f9ff",
                        "surface-variant": "#d3e4fe",
                        "on-surface": "#0b1c30",
                        "on-surface-variant": "#3e484d",
                        "outline-variant": "#bdc8ce",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#e5eeff",
                        "surface-container-high": "#dce9ff"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Hiển thị Markdown trong chat */
        .prose img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
        .prose a { color: #2563eb; text-decoration: underline; }

        @media (max-width: 767px) {
            .mobile-chat-open #sidebar-session { display: none !important; }
            .mobile-chat-open #chat-view { display: flex !important; }
            #chat-view { display: none; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface flex h-screen overflow-hidden">

    <!-- Mobile Sidebar Overlay -->
    <div class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <!-- Left Menu Navbar -->
    <nav class="bg-surface border-r border-outline-variant fixed left-0 top-0 bottom-0 w-20 flex flex-col items-center py-4 z-50 md:relative transform -translate-x-full md:translate-x-0 transition-transform duration-200" id="sidebar">
        <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white mb-8 shadow-md">
            <span class="material-symbols-outlined">smart_toy</span>
        </div>
        <div class="flex-1 flex flex-col gap-4 w-full px-2">
            <a href="#" class="w-full flex justify-center py-3 text-on-surface-variant hover:bg-surface-container rounded-xl transition-colors">
                <span class="material-symbols-outlined">dashboard</span>
            </a>
            <a href="#" class="w-full flex justify-center py-3 bg-primary-container text-white rounded-xl shadow-sm">
                <span class="material-symbols-outlined">forum</span>
            </a>
            <a href="#" class="w-full flex justify-center py-3 text-on-surface-variant hover:bg-surface-container rounded-xl transition-colors">
                <span class="material-symbols-outlined">settings_ai</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen w-full min-w-0">
        
        <!-- Header -->
        <header class="bg-surface flex justify-between items-center h-16 px-4 border-b border-outline-variant shrink-0">
            <div class="flex items-center gap-3">
                <button class="md:hidden text-on-surface-variant hover:text-primary transition-colors" onclick="toggleSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h2 class="text-lg font-bold text-primary truncate">Quản lý Chat (Admin)</h2>
            </div>
        </header>

        <!-- Split Screen -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- Session List (Cột trái) -->
            <div class="w-full md:w-1/3 md:min-w-[320px] max-w-[400px] border-r border-outline-variant bg-surface-container-lowest flex flex-col" id="sidebar-session">
                <div class="p-4 border-b border-outline-variant bg-surface-container-lowest z-10 shrink-0">
                    <h3 class="text-base font-semibold text-on-surface mb-3">Phiên hoạt động</h3>
                    <input type="text" class="w-full px-4 py-2 border border-outline-variant rounded-full text-sm focus:border-primary focus:ring-1 focus:ring-primary bg-surface" placeholder="Tìm kiếm khách hàng...">
                </div>
                <!-- Danh sách khách hàng sẽ render vào đây -->
                <div id="session-list-items" class="flex-1 overflow-y-auto">
                    <div class="p-8 text-center text-gray-400 text-sm">Đang tải dữ liệu...</div>
                </div>
            </div>

            <!-- Chat View (Cột phải) -->
            <div class="w-full md:w-auto flex-1 bg-surface-container flex flex-col relative" id="chat-view">
                
                <!-- Khung Welcome ban đầu -->
                <div id="chat-welcome" class="absolute inset-0 flex flex-col items-center justify-center bg-surface-container z-20">
                    <span class="material-symbols-outlined text-6xl text-outline-variant mb-4">forum</span>
                    <h3 class="text-lg font-semibold text-on-surface-variant">Chọn một phiên chat</h3>
                    <p class="text-sm text-outline">Bấm vào khách hàng bên trái để bắt đầu hỗ trợ</p>
                </div>

                <!-- Chat Header -->
                <div class="h-16 border-b border-outline-variant flex items-center justify-between px-4 bg-surface-container-lowest shrink-0">
                    <div class="flex items-center gap-3">
                        <button class="md:hidden p-2 -ml-2 text-on-surface-variant" onclick="closeChat()">
                            <span class="material-symbols-outlined">arrow_back</span>
                        </button>
                        <div>
                            <h3 id="chat-title" class="text-base font-semibold text-on-surface">Tên Khách Hàng</h3>
                            <p class="text-xs text-green-600 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Online
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Chat Messages -->
                <div id="messages-area" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                    <!-- Tin nhắn render ở đây -->
                </div>

                <!-- Chat Input Admin -->
                <div class="p-4 border-t border-outline-variant bg-surface-container-lowest shrink-0">
                    <div class="flex gap-3">
                        <input id="admin-message-input" type="text" placeholder="Nhập tin nhắn hỗ trợ khách..." class="flex-1 bg-surface border border-outline-variant rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-primary" />
                        <button id="send-admin-message" onclick="sendAdminMessage()" class="px-5 py-2.5 bg-primary text-white rounded-xl hover:bg-primary-container transition-colors flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">send</span> Gửi
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>
// ═══════════════════════════════════════
// CẤU HÌNH & TRẠNG THÁI
// ═══════════════════════════════════════
const pb = new PocketBase("https://nhannguyen123-chat.hf.space");

// Ưu tiên lấy Tenant từ URL, nếu không có mặc định là 'bds'
const urlParams = new URLSearchParams(window.location.search);
const TENANT = urlParams.get("bot") || "bds"; 

let allMessages = [];
let sessions = [];
let activeSession = null;
let messageIds = new Set();

const sessionListEl = document.getElementById("session-list-items");
const messagesArea = document.getElementById("messages-area");
const chatTitleEl = document.getElementById("chat-title");
const chatWelcomeEl = document.getElementById("chat-welcome");
const adminInput = document.getElementById("admin-message-input");

// ═══════════════════════════════════════
// KHỞI TẠO
// ═══════════════════════════════════════
(async function init() {
    try {
        await loadMessages();
        await subscribeRealtime();
        
        // Enter để gửi
        adminInput.addEventListener("keypress", e => {
            if (e.key === "Enter") sendAdminMessage();
        });
    } catch (err) {
        console.error("Lỗi khởi tạo:", err);
        sessionListEl.innerHTML = '<div class="p-4 text-center text-red-500 text-sm">Lỗi kết nối máy chủ!</div>';
    }
})();

// ═══════════════════════════════════════
// XỬ LÝ DỮ LIỆU
// ═══════════════════════════════════════
async function loadMessages() {
    const result = await pb.collection("messages").getList(1, 1000, {
        sort: "-created",
        filter: `tenant="${TENANT}"`
    });

    allMessages = [];
    messageIds.clear();

    for (const msg of result.items) {
        if (messageIds.has(msg.id)) continue;
        messageIds.add(msg.id);
        allMessages.push(msg);
    }

    buildSessions();
    renderSessionList();
}

function buildSessions() {
    const map = Object.create(null);

    for (const msg of allMessages) {
        if (!map[msg.session]) {
            map[msg.session] = {
                session: msg.session,
                username: msg.username || "Khách hàng",
                messages: [],
                lastMessage: msg.text || "Đã gửi tệp",
                lastCreated: msg.created
            };
        }
        
        map[msg.session].messages.push(msg);

        // Cập nhật tin nhắn mới nhất
        if (new Date(msg.created) > new Date(map[msg.session].lastCreated)) {
            map[msg.session].lastCreated = msg.created;
            map[msg.session].lastMessage = msg.text || "Đã gửi tệp";
            // Chỉ lấy tên user (tránh lấy nhầm tên Bot làm tên phiên)
            if (!msg.is_bot) {
                map[msg.session].username = msg.username || map[msg.session].username;
            }
        }
    }

    sessions = Object.values(map).sort((a, b) => new Date(b.lastCreated) - new Date(a.lastCreated));
}

// ═══════════════════════════════════════
// GIAO DIỆN
// ═══════════════════════════════════════
function renderSessionList() {
    sessionListEl.innerHTML = "";

    if (sessions.length === 0) {
        sessionListEl.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Chưa có phiên chat nào</div>';
        return;
    }

    const frag = document.createDocumentFragment();

    for (const session of sessions) {
        const div = document.createElement("div");
        div.className = "p-4 border-b border-outline-variant bg-surface-container-lowest cursor-pointer hover:bg-surface-container transition-colors";
        
        // Highlight phiên đang mở
        if (activeSession && activeSession.session === session.session) {
            div.classList.add("bg-surface-container", "border-l-4", "border-l-primary");
        }

        div.onclick = () => openChat(session.session);

        const time = new Date(session.lastCreated).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });

        div.innerHTML = `
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-full bg-primary-container text-white flex-shrink-0 flex items-center justify-center font-bold text-sm">
                    ${(session.username || "KH").slice(0, 2).toUpperCase()}
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-baseline mb-1">
                        <h4 class="text-sm font-semibold text-on-surface truncate">${escapeHtml(session.username)}</h4>
                        <span class="text-xs text-on-surface-variant whitespace-nowrap">${time}</span>
                    </div>
                    <p class="text-xs text-on-surface-variant truncate">${escapeHtml(session.lastMessage)}</p>
                </div>
            </div>
        `;
        frag.appendChild(div);
    }
    sessionListEl.appendChild(frag);
}

function openChat(sessionId) {
    document.body.classList.add("mobile-chat-open");
    chatWelcomeEl.classList.add("hidden"); // Ẩn màn hình Welcome

    activeSession = sessions.find(s => s.session === sessionId);
    if (!activeSession) return;

    chatTitleEl.textContent = activeSession.username;
    
    // Cập nhật lại list để hiện Highlight
    renderSessionList();
    renderMessages();
}

function renderMessages() {
    if (!activeSession) return;

    // Sắp xếp tin nhắn cũ -> mới
    const sorted = [...activeSession.messages].sort((a, b) => new Date(a.created) - new Date(b.created));
    
    let html = '';

    sorted.forEach(msg => {
        const time = new Date(msg.created).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
        const cleanText = DOMPurify.sanitize(marked.parse(msg.text || ""));

        if (!msg.is_bot) {
            // Tin nhắn Khách (Bên trái đối với Admin)
            html += `
                <div class="flex items-end gap-2 justify-start">
                    <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0 text-xs font-bold text-gray-600">KH</div>
                    <div class="max-w-[85%] md:max-w-[75%] bg-white text-on-surface rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm border border-gray-200">
                        <p class="text-xs font-semibold text-gray-500 mb-1">${escapeHtml(msg.username)}</p>
                        <div class="text-sm leading-relaxed prose max-w-none">${cleanText}</div>
                        <span class="text-[10px] text-gray-400 mt-1 block">${time}</span>
                    </div>
                </div>
            `;
        } else {
            // Tin nhắn Bot / Admin (Bên phải đối với Admin)
            const isAdmin = msg.username === "Admin";
            const bgClass = isAdmin ? "bg-green-600" : "bg-primary";
            const icon = isAdmin ? "support_agent" : "smart_toy";
            
            html += `
                <div class="flex items-end gap-2 justify-end">
                    <div class="max-w-[85%] md:max-w-[75%] ${bgClass} text-white rounded-2xl rounded-br-sm px-4 py-3 shadow-sm">
                        <div class="flex items-center gap-1 mb-1 opacity-80 justify-end">
                            <span class="material-symbols-outlined text-[14px]">${icon}</span>
                            <p class="text-xs font-semibold">${escapeHtml(msg.username)}</p>
                        </div>
                        <div class="text-sm leading-relaxed prose prose-invert max-w-none">${cleanText}</div>
                        <span class="text-[10px] opacity-70 mt-1 block text-right">${time}</span>
                    </div>
                </div>
            `;
        }
    });

    messagesArea.innerHTML = html;
    messagesArea.scrollTop = messagesArea.scrollHeight;
}

// ═══════════════════════════════════════
// ADMIN GỬI TIN NHẮN
// ═══════════════════════════════════════
async function sendAdminMessage() {
    const text = adminInput.value.trim();
    if (!text || !activeSession) return;

    adminInput.value = "";
    adminInput.disabled = true;

    try {
        await pb.collection("messages").create({
            session: activeSession.session,
            tenant: TENANT,
            username: "Admin", 
            text: text,
            is_bot: true // Quy ước mọi tin trả lời từ Admin/Bot đều là true để UI khách hàng phân biệt
        });
    } catch (err) {
        console.error("Lỗi gửi tin:", err);
        alert("Lỗi khi gửi tin nhắn!");
    } finally {
        adminInput.disabled = false;
        adminInput.focus();
    }
}

// ═══════════════════════════════════════
// REALTIME
// ═══════════════════════════════════════
async function subscribeRealtime() {
    await pb.collection("messages").subscribe("*", e => {
        const msg = e.record;

        if (msg.tenant !== TENANT) return;
        if (messageIds.has(msg.id)) return;
        
        messageIds.add(msg.id);
        allMessages.unshift(msg);

        buildSessions();
        renderSessionList();

        if (activeSession && msg.session === activeSession.session) {
            // Nếu đang xem đúng phiên có tin nhắn tới, render lại chat
            activeSession = sessions.find(s => s.session === activeSession.session);
            renderMessages();
        }
    });
}

// ═══════════════════════════════════════
// TIỆN ÍCH
// ═══════════════════════════════════════
function closeChat() {
    document.body.classList.remove("mobile-chat-open");
}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}

function escapeHtml(str = "") {
    return str.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}
</script>
</body>
</html>
